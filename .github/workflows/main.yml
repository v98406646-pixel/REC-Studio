name: Build REC Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup SDK and create REC Studio project
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          if [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -f /tmp/cmdtools.zip
          fi

          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          mkdir -p app/src/main/java/com/example/recstudio app/src/main/res/values app/src/main/assets

          HTML_SRC=""
          for candidate in index.html Index.html src/index.html public/index.html www/index.html; do
            if [ -f "$candidate" ] && [ -s "$candidate" ]; then
              HTML_SRC="$candidate"
              break
            fi
          done
          if [ -z "$HTML_SRC" ]; then
            FOUND_HTML=$(find . -maxdepth 4 -iname "*.html" ! -path "./app/*" ! -path "./.git/*" -size +0c | head -n 1 || true)
            if [ -n "$FOUND_HTML" ]; then
              HTML_SRC="$FOUND_HTML"
            fi
          fi
          if [ -n "$HTML_SRC" ]; then
            echo "Using HTML source: $HTML_SRC"
            cp "$HTML_SRC" app/src/main/assets/index.html
          else
            echo "WARNING: No HTML file found in repository!"
          fi

          printf '%s\n' \
            'pluginManagement {' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '    gradlePluginPortal()' \
            '  }' \
            '}' \
            'dependencyResolutionManagement {' \
            '  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '  }' \
            '}' \
            'rootProject.name = "REC Studio"' \
            'include(":app")' > settings.gradle.kts

          printf '%s\n' \
            'plugins {' \
            '  id("com.android.application") version "8.5.2" apply false' \
            '  id("org.jetbrains.kotlin.android") version "1.9.24" apply false' \
            '}' > build.gradle.kts

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2560m' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '  id("com.android.application")' \
            '  id("org.jetbrains.kotlin.android")' \
            '}' \
            'android {' \
            '  namespace = "com.example.recstudio"' \
            '  compileSdk = 34' \
            '  defaultConfig {' \
            '    applicationId = "com.example.recstudio"' \
            '    minSdk = 24' \
            '    targetSdk = 34' \
            '    versionCode = 1' \
            '    versionName = "1.0"' \
            '  }' \
            '  buildTypes {' \
            '    release {' \
            '      isMinifyEnabled = false' \
            '    }' \
            '  }' \
            '  compileOptions {' \
            '    sourceCompatibility = JavaVersion.VERSION_17' \
            '    targetCompatibility = JavaVersion.VERSION_17' \
            '  }' \
            '  kotlinOptions {' \
            '    jvmTarget = "17"' \
            '  }' \
            '}' \
            'dependencies {' \
            '  implementation("androidx.core:core-ktx:1.13.1")' \
            '  implementation("androidx.appcompat:appcompat:1.7.0")' \
            '}' > app/build.gradle.kts

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <uses-permission android:name="android.permission.INTERNET" />' \
            '  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '  <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
            '  <uses-permission android:name="android.permission.CAMERA" />' \
            '  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' \
            '  <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />' \
            '  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' \
            '  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' \
            '  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' \
            '  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
            '  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' \
            '  <uses-permission android:name="android.permission.WAKE_LOCK" />' \
            '  <uses-feature android:name="android.hardware.camera" android:required="false" />' \
            '  <uses-feature android:name="android.hardware.microphone" android:required="false" />' \
            '  <application android:allowBackup="true" android:label="REC Studio" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">' \
            '    <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">' \
            '      <intent-filter>' \
            '        <action android:name="android.intent.action.MAIN" />' \
            '        <category android:name="android.intent.category.LAUNCHER" />' \
            '      </intent-filter>' \
            '    </activity>' \
            '    <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="specialUse" />' \
            '  </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources><string name="app_name">REC Studio</string></resources>' > app/src/main/res/values/strings.xml

          printf '%s\n' \
            'package com.example.recstudio' \
            'import android.app.Notification' \
            'import android.app.NotificationChannel' \
            'import android.app.NotificationManager' \
            'import android.app.PendingIntent' \
            'import android.app.Service' \
            'import android.content.Intent' \
            'import android.graphics.Color' \
            'import android.graphics.PixelFormat' \
            'import android.graphics.drawable.GradientDrawable' \
            'import android.os.Build' \
            'import android.os.IBinder' \
            'import android.view.Gravity' \
            'import android.view.MotionEvent' \
            'import android.view.View' \
            'import android.view.WindowManager' \
            'import android.widget.LinearLayout' \
            'import android.widget.TextView' \
            'class OverlayService : Service() {' \
            '  private var windowManager: WindowManager? = null' \
            '  private var panelView: View? = null' \
            '  override fun onBind(intent: Intent?): IBinder? = null' \
            '  override fun onCreate() {' \
            '    super.onCreate()' \
            '    startForegroundNotification()' \
            '    showOverlayPanel()' \
            '  }' \
            '  private fun startForegroundNotification() {' \
            '    val channelId = "rec_studio_overlay"' \
            '    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {' \
            '      val mgr = getSystemService(NotificationManager::class.java)' \
            '      val ch = NotificationChannel(channelId, "REC Studio Panel", NotificationManager.IMPORTANCE_LOW)' \
            '      mgr?.createNotificationChannel(ch)' \
            '    }' \
            '    val openIntent = Intent(this, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }' \
            '    val pending = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_IMMUTABLE)' \
            '    val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, channelId) else @Suppress("DEPRECATION") Notification.Builder(this)' \
            '    val notification = builder.setContentTitle("REC Studio").setContentText("Панель поверх окон активна").setSmallIcon(android.R.drawable.presence_video_online).setContentIntent(pending).build()' \
            '    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {' \
            '      startForeground(2026, notification)' \
            '    } else {' \
            '      @Suppress("DEPRECATION") startForeground(2026, notification)' \
            '    }' \
            '  }' \
            '  private fun showOverlayPanel() {' \
            '    if (panelView != null) return' \
            '    val wm = getSystemService(WINDOW_SERVICE) as WindowManager' \
            '    windowManager = wm' \
            '    val density = resources.displayMetrics.density' \
            '    fun dp(v: Int): Int = (v * density).toInt()' \
            '    val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE' \
            '    val params = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, layoutType, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN, PixelFormat.TRANSLUCENT).apply {' \
            '      gravity = Gravity.TOP or Gravity.START' \
            '      x = dp(16)' \
            '      y = dp(140)' \
            '    }' \
            '    val box = LinearLayout(this).apply {' \
            '      orientation = LinearLayout.HORIZONTAL' \
            '      gravity = Gravity.CENTER_VERTICAL' \
            '      setPadding(dp(10), dp(6), dp(10), dp(6))' \
            '      background = GradientDrawable().apply {' \
            '        setColor(Color.parseColor("#CC140D24"))' \
            '        cornerRadius = dp(18).toFloat()' \
            '        setStroke(dp(1), Color.parseColor("#556C3EF4"))' \
            '      }' \
            '    }' \
            '    val openBtn = TextView(this).apply {' \
            '      text = "REC"' \
            '      setTextColor(Color.WHITE)' \
            '      textSize = 12f' \
            '      setPadding(dp(6), dp(2), dp(8), dp(2))' \
            '      setOnClickListener {' \
            '        val i = Intent(this@OverlayService, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP) }' \
            '        startActivity(i)' \
            '      }' \
            '    }' \
            '    val closeBtn = TextView(this).apply {' \
            '      text = "×"' \
            '      setTextColor(Color.parseColor("#FF285C"))' \
            '      textSize = 14f' \
            '      setPadding(dp(6), dp(2), dp(4), dp(2))' \
            '      setOnClickListener { stopSelf() }' \
            '    }' \
            '    box.addView(openBtn)' \
            '    box.addView(closeBtn)' \
            '    var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f' \
            '    box.setOnTouchListener { _, ev ->' \
            '      when (ev.action) {' \
            '        MotionEvent.ACTION_DOWN -> { initX = params.x; initY = params.y; touchX = ev.rawX; touchY = ev.rawY; false }' \
            '        MotionEvent.ACTION_MOVE -> {' \
            '          val dx = (ev.rawX - touchX).toInt(); val dy = (ev.rawY - touchY).toInt()' \
            '          if (kotlin.math.abs(dx) > 6 || kotlin.math.abs(dy) > 6) {' \
            '            params.x = initX + dx; params.y = initY + dy' \
            '            wm.updateViewLayout(box, params); true' \
            '          } else false' \
            '        }' \
            '        else -> false' \
            '      }' \
            '    }' \
            '    wm.addView(box, params)' \
            '    panelView = box' \
            '  }' \
            '  override fun onDestroy() {' \
            '    panelView?.let { try { windowManager?.removeView(it) } catch (_: Exception) {} }' \
            '    panelView = null' \
            '    super.onDestroy()' \
            '  }' \
            '}' > app/src/main/java/com/example/recstudio/OverlayService.kt

          printf '%s\n' \
            'package com.example.recstudio' \
            'import android.Manifest' \
            'import android.content.Intent' \
            'import android.content.pm.PackageManager' \
            'import android.net.Uri' \
            'import android.os.Build' \
            'import android.os.Bundle' \
            'import android.provider.Settings' \
            'import android.webkit.PermissionRequest' \
            'import android.webkit.WebChromeClient' \
            'import android.webkit.WebResourceError' \
            'import android.webkit.WebResourceRequest' \
            'import android.webkit.WebSettings' \
            'import android.webkit.WebView' \
            'import android.webkit.WebViewClient' \
            'import androidx.appcompat.app.AppCompatActivity' \
            'import androidx.core.app.ActivityCompat' \
            'import androidx.core.content.ContextCompat' \
            'import java.io.File' \
            'class MainActivity : AppCompatActivity() {' \
            '  override fun onCreate(savedInstanceState: Bundle?) {' \
            '    super.onCreate(savedInstanceState)' \
            '    val webView = WebView(this)' \
            '    webView.settings.javaScriptEnabled = true' \
            '    webView.settings.domStorageEnabled = true' \
            '    webView.settings.mediaPlaybackRequiresUserGesture = false' \
            '    webView.settings.allowFileAccess = true' \
            '    webView.settings.allowContentAccess = true' \
            '    webView.settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW' \
            '    webView.webViewClient = object : WebViewClient() {' \
            '      override fun onReceivedError(view: WebView?, request: WebResourceRequest?, error: WebResourceError?) {' \
            '        if (request?.isForMainFrame == true) {' \
            '          val msg = error?.description?.toString() ?: "Ошибка загрузки"' \
            '          val html = "<html><body style=\"background:#111;color:#fff;font-family:sans-serif;padding:24px\"><h2>REC Studio</h2><p>Не удалось загрузить интерфейс: $msg</p><button onclick=\"location.reload()\" style=\"padding:12px 18px;font-size:16px\">Обновить</button></body></html>"' \
            '          view?.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null)' \
            '        }' \
            '      }' \
            '    }' \
            '    webView.webChromeClient = object : WebChromeClient() {' \
            '      override fun onPermissionRequest(request: PermissionRequest) {' \
            '        runOnUiThread { request.grant(request.resources) }' \
            '      }' \
            '    }' \
            '    setContentView(webView)' \
            '    requestAppPermissions()' \
            '    startOverlayIfPermitted()' \
            '    val localIndex = File(filesDir, "index.html")' \
            '    val assetExists = try { assets.open("index.html").use { it.available() > 0 } } catch (_: Exception) { false }' \
            '    when {' \
            '      localIndex.exists() && localIndex.length() > 0L -> webView.loadUrl("file://" + localIndex.absolutePath)' \
            '      assetExists -> webView.loadUrl("file:///android_asset/index.html")' \
            '      else -> {' \
            '        val fallbackHtml = "<html><body style=\"background:#111;color:#fff;font-family:sans-serif;padding:24px\"><h2>REC Studio</h2><p>Файл index.html не найден в репозитории и в APK.</p><p>Загрузите <b>index.html</b> в корень ветки <b>main</b> репозитория <b>REC-Studio</b> и пересоберите приложение.</p></body></html>"' \
            '        webView.loadDataWithBaseURL(null, fallbackHtml, "text/html", "UTF-8", null)' \
            '      }' \
            '    }' \
            '  }' \
            '  override fun onResume() {' \
            '    super.onResume()' \
            '    startOverlayIfPermitted()' \
            '  }' \
            '  private fun startOverlayIfPermitted() {' \
            '    if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) {' \
            '      val i = Intent(this, OverlayService::class.java)' \
            '      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)' \
            '    }' \
            '  }' \
            '  private fun requestAppPermissions() {' \
            '    val perms = mutableListOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA)' \
            '    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {' \
            '      perms.add(Manifest.permission.POST_NOTIFICATIONS)' \
            '      perms.add(Manifest.permission.READ_MEDIA_VIDEO)' \
            '      perms.add(Manifest.permission.READ_MEDIA_AUDIO)' \
            '      perms.add(Manifest.permission.READ_MEDIA_IMAGES)' \
            '    } else {' \
            '      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)' \
            '    }' \
            '    val missing = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }' \
            '    if (missing.isNotEmpty()) { ActivityCompat.requestPermissions(this, missing.toTypedArray(), 1001) }' \
            '    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {' \
            '      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))' \
            '    }' \
            '  }' \
            '}' > app/src/main/java/com/example/recstudio/MainActivity.kt

          printf '%s\n' \
            'import os, shutil, struct, zlib' \
            'cands = ["icon.png", "Icon.png"]' \
            'for r, _, fs in os.walk("."):' \
            '    if ".git" in r or "app/build" in r:' \
            '        continue' \
            '    for f in fs:' \
            '        if f.lower() == "icon.png":' \
            '            cands.append(os.path.join(r, f))' \
            'src = None' \
            'for p in cands:' \
            '    if os.path.isfile(p) and os.path.getsize(p) > 0:' \
            '        src = p' \
            '        break' \
            'def chunk(t, d):' \
            '    return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xffffffff)' \
            'raw = b"".join(b"\x00" + b"\xdc\x26\x26\xff" * 16 for _ in range(16))' \
            'fb = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", 16, 16, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")' \
            'dirs = ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]' \
            'for d in dirs:' \
            '    out_dir = os.path.join("app/src/main/res", d)' \
            '    os.makedirs(out_dir, exist_ok=True)' \
            '    for name in ("ic_launcher.png", "ic_launcher_round.png"):' \
            '        dst = os.path.join(out_dir, name)' \
            '        if src:' \
            '            shutil.copyfile(src, dst)' \
            '        else:' \
            '            with open(dst, "wb") as fp:' \
            '                fp.write(fb)' > make_icons.py

          python3 make_icons.py

      - name: Build REC Studio APK
        run: |
          set -e
          gradle assembleDebug --console=plain || {
            echo "=== FAILURE SUMMARY ==="
            gradle assembleDebug --console=plain --offline 2>&1 | grep -E "(> Task |FAILURE:|Caused by:|Execution failed|error:)" -A 2 || true
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rec-studio-apk
          path: app/build/outputs/apk/debug/*.apk

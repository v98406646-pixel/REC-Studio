            '      val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())' \
            '      val fileName = "REC_$stamp.mp4"' \
            '      var micEnabled = withMic' \
            '      val recorder = try {' \
            '        buildRecorder(width, height, fileName, withMic)' \
            '      } catch (_: Exception) {' \
            '        if (withMic) {' \
            '          cleanupOutput()' \
            '          micEnabled = false' \
            '          buildRecorder(width, height, fileName, false)' \
            '        } else {' \
            '          throw IllegalStateException("Не удалось подготовить запись")' \
            '        }' \
            '      }' \
            '      val mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager' \
            '      val proj = mgr.getMediaProjection(resultCode, data)' \
            '      if (proj == null) { cleanupRecorder(); stopSelf(); return }' \
            '      proj.registerCallback(object : MediaProjection.Callback() {' \
            '        override fun onStop() { stopCaptureAndSave() }' \

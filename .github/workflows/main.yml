            '      val values = ContentValues().apply {' \
            '        put(MediaStore.Video.Media.DISPLAY_NAME, fileName)' \
            '        put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")' \
            '        put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/REC-Studio")' \
            '        put(MediaStore.Video.Media.IS_PENDING, 1)' \
            '      }' \
            '      val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)' \
            '      val opened = uri?.let { contentResolver.openFileDescriptor(it, "w") }' \
            '      if (uri != null && opened != null) {' \
            '        pendingUri = uri' \
            '        pfd = opened' \
            '        recorder.setOutputFile(opened.fileDescriptor)' \
            '        return' \
            '      }' \
            '      if (uri != null) contentResolver.delete(uri, null, null)' \
            '      val dir = File(getExternalFilesDir(Environment.DIRECTORY_MOVIES), "REC-Studio").apply { mkdirs() }' \
            '      val f = File(dir, fileName)' \
            '      fallbackFile = f' \
            '      recorder.setOutputFile(f.absolutePath)' \
            '    } else {' \
            '      @Suppress("DEPRECATION") val pub = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES), "REC-Studio").apply { mkdirs() }' \
            '      val f = File(pub, fileName)' \
            '      fallbackFile = f' \
            '      recorder.setOutputFile(f.absolutePath)' \
            '    }' \
            '  }' \
            '  private fun buildRecorder(width: Int, height: Int, fileName: String, includeMic: Boolean): MediaRecorder {' \
            '    val recorder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) MediaRecorder(this) else @Suppress("DEPRECATION") MediaRecorder()' \

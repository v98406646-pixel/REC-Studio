name: Build REC Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup SDK and create REC Studio project
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          if [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -f /tmp/cmdtools.zip
          fi

          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          mkdir -p app/src/main/java/com/example/recstudio app/src/main/res/values app/src/main/assets

          HTML_SRC=""
          for candidate in index.html Index.html src/index.html public/index.html www/index.html; do
            if [ -f "$candidate" ] && [ -s "$candidate" ]; then
              HTML_SRC="$candidate"
              break
            fi
          done
          if [ -z "$HTML_SRC" ]; then
            FOUND_HTML=$(find . -maxdepth 4 -iname "*.html" ! -path "./app/*" ! -path "./.git/*" -size +0c | head -n 1 || true)
            if [ -n "$FOUND_HTML" ]; then
              HTML_SRC="$FOUND_HTML"
            fi
          fi
          if [ -n "$HTML_SRC" ]; then
            echo "Using HTML source: $HTML_SRC"
            cp "$HTML_SRC" app/src/main/assets/index.html
          else
            echo "WARNING: No HTML file found in repository!"
          fi

          printf '%s\n' \
            'pluginManagement {' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '    gradlePluginPortal()' \
            '  }' \
            '}' \
            'dependencyResolutionManagement {' \
            '  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '  }' \
            '}' \
            'rootProject.name = "REC Studio"' \
            'include(":app")' > settings.gradle.kts

          printf '%s\n' \
            'plugins {' \
            '  id("com.android.application") version "8.5.2" apply false' \
            '  id("org.jetbrains.kotlin.android") version "1.9.24" apply false' \
            '}' > build.gradle.kts

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2560m' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '  id("com.android.application")' \
            '  id("org.jetbrains.kotlin.android")' \
            '}' \
            'android {' \
            '  namespace = "com.example.recstudio"' \
            '  compileSdk = 34' \
            '  defaultConfig {' \
            '    applicationId = "com.example.recstudio"' \
            '    minSdk = 24' \
            '    targetSdk = 34' \
            '    versionCode = 1' \
            '    versionName = "1.0"' \
            '  }' \
            '  buildTypes {' \
            '    release {' \
            '      isMinifyEnabled = false' \
            '    }' \
            '  }' \
            '  compileOptions {' \
            '    sourceCompatibility = JavaVersion.VERSION_17' \
            '    targetCompatibility = JavaVersion.VERSION_17' \
            '  }' \
            '  kotlinOptions {' \
            '    jvmTarget = "17"' \
            '  }' \
            '}' \
            'dependencies {' \
            '  implementation("androidx.core:core-ktx:1.13.1")' \
            '  implementation("androidx.appcompat:appcompat:1.7.0")' \
            '}' > app/build.gradle.kts

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <uses-permission android:name="android.permission.INTERNET" />' \
            '  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '  <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
            '  <uses-permission android:name="android.permission.CAMERA" />' \
            '  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' \
            '  <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />' \
            '  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' \
            '  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' \
            '  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' \
            '  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
            '  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />' \
            '  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' \
            '  <uses-permission android:name="android.permission.WAKE_LOCK" />' \
            '  <uses-feature android:name="android.hardware.camera" android:required="false" />' \
            '  <uses-feature android:name="android.hardware.microphone" android:required="false" />' \
            '  <application android:allowBackup="true" android:label="REC Studio" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">' \
            '    <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:configChanges="orientation|screenSize|keyboardHidden">' \
            '      <intent-filter>' \
            '        <action android:name="android.intent.action.MAIN" />' \
            '        <category android:name="android.intent.category.LAUNCHER" />' \
            '      </intent-filter>' \
            '    </activity>' \
            '    <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="specialUse" />' \
            '    <service android:name=".ScreenRecordService" android:exported="false" android:foregroundServiceType="mediaProjection|microphone" />' \
            '  </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources><string name="app_name">REC Studio</string></resources>' > app/src/main/res/values/strings.xml

          printf '%s\n' \
            'package com.example.recstudio' \
            'import android.Manifest' \
            'import android.app.Notification' \
            'import android.app.NotificationChannel' \
            'import android.app.NotificationManager' \
            'import android.app.Service' \
            'import android.content.ContentValues' \
            'import android.content.Intent' \
            'import android.content.pm.PackageManager' \
            'import android.content.pm.ServiceInfo' \
            'import android.hardware.display.DisplayManager' \
            'import android.hardware.display.VirtualDisplay' \
            'import android.media.MediaRecorder' \
            'import android.media.projection.MediaProjection' \
            'import android.media.projection.MediaProjectionManager' \
            'import android.net.Uri' \
            'import android.os.Build' \
            'import android.os.Environment' \
            'import android.os.Handler' \
            'import android.os.IBinder' \
            'import android.os.Looper' \
            'import android.os.ParcelFileDescriptor' \
            'import android.provider.MediaStore' \
            'import android.util.DisplayMetrics' \
            'import android.view.WindowManager' \
            'import android.widget.Toast' \
            'import androidx.core.content.ContextCompat' \
            'import java.io.File' \
            'import java.text.SimpleDateFormat' \
            'import java.util.Date' \
            'import java.util.Locale' \
            'class ScreenRecordService : Service() {' \
            '  companion object {' \
            '    const val ACTION_START = "com.example.recstudio.action.START_RECORD"' \
            '    const val ACTION_STOP = "com.example.recstudio.action.STOP_RECORD"' \
            '    const val EXTRA_RESULT_CODE = "result_code"' \
            '    const val EXTRA_DATA = "data"' \
            '    @Volatile var isRecording = false' \
            '    var onStateChange: ((Boolean) -> Unit)? = null' \
            '  }' \
            '  private var mediaProjection: MediaProjection? = null' \
            '  private var virtualDisplay: VirtualDisplay? = null' \
            '  private var mediaRecorder: MediaRecorder? = null' \
            '  private var pfd: ParcelFileDescriptor? = null' \
            '  private var pendingUri: Uri? = null' \
            '  private var fallbackFile: File? = null' \
            '  private val mainHandler = Handler(Looper.getMainLooper())' \
            '  override fun onBind(intent: Intent?): IBinder? = null' \
            '  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {' \
            '    when (intent?.action) {' \
            '      ACTION_START -> {' \
            '        if (isRecording) return START_STICKY' \
            '        val hasMicPerm = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED' \
            '        startForegroundNotif("Запись экрана активна", hasMicPerm)' \
            '        val code = intent.getIntExtra(EXTRA_RESULT_CODE, 0)' \
            '        val data: Intent? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) intent.getParcelableExtra(EXTRA_DATA, Intent::class.java) else @Suppress("DEPRECATION") intent.getParcelableExtra(EXTRA_DATA)' \
            '        if (code != 0 && data != null) {' \

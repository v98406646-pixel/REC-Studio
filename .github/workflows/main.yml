            '  private fun startForegroundNotif(text: String, withMic: Boolean) {' \
            '    val chId = "rec_studio_record"' \
            '    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {' \
            '      val mgr = getSystemService(NotificationManager::class.java)' \
            '      mgr?.createNotificationChannel(NotificationChannel(chId, "REC Studio Recording", NotificationManager.IMPORTANCE_LOW))' \
            '    }' \
            '    val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, chId) else @Suppress("DEPRECATION") Notification.Builder(this)' \
            '    val n = builder.setContentTitle("REC Studio").setContentText(text).setSmallIcon(android.R.drawable.presence_video_online).build()' \
            '    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {' \
            '      val fType = if (withMic) ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE else ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION' \
            '      startForeground(2027, n, fType)' \
            '    } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {' \
            '      startForeground(2027, n)' \
            '    } else {' \

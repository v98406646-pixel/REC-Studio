name: Build REC Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup SDK and create REC Studio project structure
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          if [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -f /tmp/cmdtools.zip
          fi

          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          mkdir -p .github/workflows
          mkdir -p app/src/main/java/com/example/recstudio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "REC Studio"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2560m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }

          android {
            namespace = "com.example.recstudio"
            compileSdk = 34

            defaultConfig {
              applicationId = "com.example.recstudio"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "1.0"
            }

            buildTypes {
              release {
                isMinifyEnabled = false
              }
            }

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
              jvmTarget = "17"
            }
          }

          dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />

            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.microphone" android:required="false" />

            <application
              android:allowBackup="true"
              android:label="REC Studio"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:supportsRtl="true"
              android:theme="@style/Theme.AppCompat.Light.NoActionBar">

              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>

            </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">REC Studio</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/java/com/example/recstudio/MainActivity.kt
          package com.example.recstudio

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.io.File

          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)

              val webView = WebView(this)
              webView.settings.javaScriptEnabled = true
              webView.settings.domStorageEnabled = true
              webView.settings.mediaPlaybackRequiresUserGesture = false
              webView.settings.allowFileAccess = true
              webView.settings.allowContentAccess = true
              webView.webViewClient = WebViewClient()
              webView.webChromeClient = object : WebChromeClient() {
                override fun onPermissionRequest(request: PermissionRequest) {
                  runOnUiThread {
                    request.grant(request.resources)
                  }
                }
              }
              setContentView(webView)

              requestAppPermissions()

              val localIndex = File(filesDir, "index.html")
              if (localIndex.exists()) {
                webView.loadUrl("file://" + localIndex.absolutePath)
              } else {
                webView.loadUrl("https://raw.githubusercontent.com/v98406646-pixel/REC-Studio/main/index.html")
              }
            }

            private fun requestAppPermissions() {
              val perms = mutableListOf(
                Manifest.permission.RECORD_AUDIO,
                Manifest.permission.CAMERA
              )
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                perms.add(Manifest.permission.POST_NOTIFICATIONS)
                perms.add(Manifest.permission.READ_MEDIA_VIDEO)
                perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                perms.add(Manifest.permission.READ_MEDIA_IMAGES)
              } else {
                perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
              }

              val missing = perms.filter {
                ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
              }
              if (missing.isNotEmpty()) {
                ActivityCompat.requestPermissions(this, missing.toTypedArray(), 1001)
              }

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                val intent = Intent(
                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                  Uri.parse("package:$packageName")
                )
                startActivity(intent)
              }
            }
          }
          EOF

          python3 - <<'PY'
import os
from PIL import Image, ImageDraw

sizes = {
    "mipmap-mdpi": 48,
    "mipmap-hdpi": 72,
    "mipmap-xhdpi": 96,
    "mipmap-xxhdpi": 144,
    "mipmap-xxxhdpi": 192,
}

candidates = ["icon.png", "Icon.png"]
for root, _, files in os.walk("."):
    if ".git" in root or "app/build" in root:
        continue
    for f in files:
        if f.lower() == "icon.png":
            candidates.append(os.path.join(root, f))

img = None
for path in candidates:
    if os.path.isfile(path):
        try:
            img = Image.open(path).convert("RGBA")
            img.load()
            break
        except Exception:
            img = None

for folder, px in sizes.items():
    out_dir = os.path.join("app/src/main/res", folder)
    os.makedirs(out_dir, exist_ok=True)
    if img is not None:
        icon = img.resize((px, px), Image.Resampling.LANCZOS)
    else:
        icon = Image.new("RGBA", (px, px), (220, 38, 38, 255))
        draw = ImageDraw.Draw(icon)
        pad = max(2, px // 4)
        draw.ellipse((pad, pad, px - pad, px - pad), fill=(255, 255, 255, 255))
    icon.save(os.path.join(out_dir, "ic_launcher.png"), format="PNG")
    icon.save(os.path.join(out_dir, "ic_launcher_round.png"), format="PNG")
PY

      - name: Build REC Studio APK
        run: |
          set -e
          gradle assembleDebug --console=plain || {
            echo "=== FAILURE SUMMARY ==="
            gradle assembleDebug --console=plain --offline 2>&1 | grep -E "(> Task |FAILURE:|Caused by:|Execution failed|error:)" -A 2 || true
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rec-studio-apk
          path: app/build/outputs/apk/debug/*.apk
